name: Paper-1 Pages offline reference

on:
  push:
    paths:
      - 'ontology/**/*.ttl'
      - 'docs/ontology/generated/**'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/wiki/pages/Semantic-Architecture.md'
      - 'docs/ontology/pages-version-registry-v0.1.json'
      - 'site/ontology/**'
      - 'tools/build_pages_reference.py'
      - 'tools/check_pages_route_history.py'
      - '.github/workflows/paper1-pages-offline-reference.yml'
  pull_request:
    paths:
      - 'ontology/**/*.ttl'
      - 'docs/ontology/generated/**'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/wiki/pages/Semantic-Architecture.md'
      - 'docs/ontology/pages-version-registry-v0.1.json'
      - 'site/ontology/**'
      - 'tools/build_pages_reference.py'
      - 'tools/check_pages_route_history.py'
      - '.github/workflows/paper1-pages-offline-reference.yml'

permissions:
  contents: read

jobs:
  versioned-offline-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'rdflib==7.6.0'
      - name: Check source binding, route and generated HTML without deployment
        run: python tools/build_pages_reference.py --check
      - name: Reject changes to routes in the parent commit
        run: python tools/check_pages_route_history.py
