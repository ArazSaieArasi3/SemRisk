name: Paper 1 core contract regressions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rdflib==7.6.0
      - name: Run 18 bounded regression probes
        run: python tools/check_run3_core_contract.py
      - name: Audit source and disposition references
        run: python tools/check_run3_traceability.py
      - name: Validate author-revision controls
        run: python docs/execution/2026-10-04/validate_register.py
      - name: Check bounded objective and domain evidence crosswalk
        run: python tools/check_objective_domain_crosswalk.py
