name: Paper 1 rc4 selected publication assets
on:
  pull_request:
    paths:
      - 'publications/2026-icaea-sbu/visuals-rc4/**'
      - 'tools/*publication_assets_rc4.py'
      - 'diagrams/ontouml/0.2.0-rc.4/**'
      - 'docs/formal/0.2.0-rc.4/source-manifest.json'
      - 'evaluation/exposure-scale/v0.2.0-rc.4/ci-evidence.json'
      - 'case/pharma/literature-pilot-v0.1.0/metrics.json'
      - 'evaluation/cq/issue52-cq-results-v1.0.csv'
      - 'evaluation/parity/p49-parity-results-v1.0.csv'
      - '.github/workflows/paper1-publication-assets-rc4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-figure-and-evidence-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r publications/2026-icaea-sbu/visuals-rc4/requirements.txt
      - name: Source reproduction and committed vector print QA
        run: |
          python tools/build_publication_assets_rc4.py --check
          python tools/check_publication_assets_rc4.py
      - name: Fresh vector export and seven rejection controls
        run: |
          python tools/build_publication_assets_rc4.py --pdf
          python tools/check_publication_assets_rc4.py
      - uses: actions/upload-artifact@v4
        with:
          name: selected-publication-assets-rc4
          path: publications/2026-icaea-sbu/visuals-rc4/
