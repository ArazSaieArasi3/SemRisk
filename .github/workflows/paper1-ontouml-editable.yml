name: Paper-1 editable OntoUML
on:
  push:
    paths: ['diagrams/ontouml/**', 'tools/*ontouml*', 'ontology/releases/0.2.0-rc.3/**', 'foundational/semantic-identity-v0.2.0-rc.3/**', '.github/workflows/paper1-ontouml-editable.yml']
  pull_request:
    paths: ['diagrams/ontouml/**', 'tools/*ontouml*', 'ontology/releases/0.2.0-rc.3/**', 'foundational/semantic-identity-v0.2.0-rc.3/**', '.github/workflows/paper1-ontouml-editable.yml']
permissions:
  contents: read
jobs:
  editable-model-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r diagrams/ontouml/0.2.0-rc.3/requirements.txt
      - run: npm install --no-save --package-lock=false @viz-js/viz@3.25.0
      - name: Validate committed source-bound model and six negative controls
        run: python tools/check_ontouml_atlas.py
      - name: Rebuild semantic specification without drift
        run: |
          python tools/build_ontouml_atlas.py
          git diff --exit-code -- diagrams/ontouml/0.2.0-rc.3/model-base.json diagrams/ontouml/0.2.0-rc.3/view-spec.json diagrams/ontouml/0.2.0-rc.3/*coverage.csv diagrams/ontouml/0.2.0-rc.3/multiplicity-evidence.csv diagrams/ontouml/0.2.0-rc.3/views/*.dot
      - name: Rebuild geometry and vector PDF
        run: |
          node tools/render_ontouml_views.cjs
          python tools/package_ontouml_atlas.py
          python tools/check_ontouml_atlas.py
      - uses: actions/upload-artifact@v4
        with:
          name: semrisk-rc3-editable-ontouml
          path: diagrams/ontouml/0.2.0-rc.3/
