name: SemRisk Paper 1 author review claim guard
on:
  push:
    paths:
      - 'ontology/**'
      - 'shapes/**'
      - 'rules/**'
      - '.research/manifest.yaml'
      - 'docs/research/**'
      - 'evaluation/integrity/**'
      - 'evaluation/assurance/**'
      - 'evaluation/oquare/**'
      - 'evaluation/vveaa/**'
      - 'publications/2026-icae/**'
      - 'publications/2026-icae/manuscript-working-draft-v0.3.md'
      - 'publications/2026-icae/author-review-claim-evidence-v0.2.csv'
      - 'publications/2026-icae/claim-calibration-preliminary-v0.1.csv'
      - 'publications/2026-icae/manuscript-claim-placement-audit-v0.3.csv'
      - 'evaluation/vveaa/paper1-vveaa-claim-method-evidence-v0.1.csv'
      - 'tools/paper1_vveaa_evidence_guard.py'
      - 'evaluation/e1-e4/issue29-e1-e4-results-v1.0.csv'
      - 'evaluation/e5-e6/e6-preliminary-validation-report-v0.1.md'
      - 'evaluation/parity/p49-parity-results-v1.0.csv'
      - 'evaluation/e8-e11/issue31-readiness-results-v0.1.csv'
      - 'build/p1-r2-semantic-build-evidence-2026-09-23.md'
      - 'evaluation/architecture/ea-capability-nonclaim-matrix-v1.0.csv'
      - 'tools/author_review_claim_guard.py'
      - '.github/workflows/paper1-author-review-claims.yml'
  pull_request:
    paths:
      - 'ontology/**'
      - 'shapes/**'
      - 'rules/**'
      - '.research/manifest.yaml'
      - 'docs/research/**'
      - 'evaluation/integrity/**'
      - 'evaluation/assurance/**'
      - 'evaluation/oquare/**'
      - 'evaluation/vveaa/**'
      - 'publications/2026-icae/**'
      - 'publications/2026-icae/manuscript-working-draft-v0.3.md'
      - 'publications/2026-icae/author-review-claim-evidence-v0.2.csv'
      - 'publications/2026-icae/claim-calibration-preliminary-v0.1.csv'
      - 'publications/2026-icae/manuscript-claim-placement-audit-v0.3.csv'
      - 'evaluation/vveaa/paper1-vveaa-claim-method-evidence-v0.1.csv'
      - 'tools/paper1_vveaa_evidence_guard.py'
      - 'evaluation/e1-e4/issue29-e1-e4-results-v1.0.csv'
      - 'evaluation/e5-e6/e6-preliminary-validation-report-v0.1.md'
      - 'evaluation/parity/p49-parity-results-v1.0.csv'
      - 'evaluation/e8-e11/issue31-readiness-results-v0.1.csv'
      - 'build/p1-r2-semantic-build-evidence-2026-09-23.md'
      - 'evaluation/architecture/ea-capability-nonclaim-matrix-v1.0.csv'
      - 'tools/author_review_claim_guard.py'
      - '.github/workflows/paper1-author-review-claims.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  bounded-claim-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check bounded claims and negative fixtures
        run: |
          python3 tools/author_review_claim_guard.py --selftest
          python3 tools/paper1_vveaa_evidence_guard.py --selftest --report build/paper1-claims/vveaa-integrity.json
      - name: Preserve bounded claim evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-claims-${{ github.sha }}
          path: build/paper1-claims/
          if-no-files-found: error
          retention-days: 30
