name: Paper 1 pharmaceutical literature pilot
on:
  pull_request:
    paths: ['case/pharma/literature-pilot-v0.1.0/**', 'tools/*pharma_literature*', 'tools/check_literature_postgres.py', 'relational/scripts/literature_io.py', '.github/workflows/paper1-literature-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  literature-dataset-and-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semrisk
          POSTGRES_PASSWORD: semrisk
          POSTGRES_DB: semrisk_literature_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U semrisk -d semrisk_literature_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: semrisk
      PGPASSWORD: semrisk
      PGDATABASE: semrisk_literature_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-qualified-context.txt
      - name: Rebuild and integrity checks
        run: |
          python tools/build_pharma_literature_pilot.py
          python tools/check_pharma_literature_pilot.py
          python tools/build_pharma_literature_pilot.py
          git diff --exit-code -- case/pharma/literature-pilot-v0.1.0
      - name: Native PostgreSQL source-payload staging
        run: |
          python - <<'PY'
          import psycopg
          from pathlib import Path
          with psycopg.connect('',autocommit=True) as c:
              for name in ['V001__paper1_projection.sql','V002__data_load_support.sql']:
                  c.execute(Path('relational/sql',name).read_text())
          PY
          python tools/check_literature_postgres.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pharmaceutical-literature-pilot-evidence
          path: case/pharma/literature-pilot-v0.1.0/
