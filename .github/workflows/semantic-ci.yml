name: SemRisk Semantic CI

on:
  workflow_dispatch:
  push:
    paths:
      - "ontology/**"
      - "shapes/**"
      - "rules/**"
      - "testdata/**"
      - "formalization/**"
      - "foundational/**"
      - "architecture/g2/**"
      - "governance/identity/**"
      - "tools/semrisk_semantic_ci.py"
      - "tools/issue50_semantic_mutation_check.py"
      - "tools/issue50_entailment_mutation_check.py"
      - "tools/r1_foundational_guardrail_check.py"
      - "tools/r2_owner_rule_temporal_check.py"
      - "tools/r2_formal_semantics_guard_check.py"
      - "tools/requirements-semantic-ci.txt"
      - "tools/semantic-tool-manifest.csv"
      - "evaluation/standards/**"\n      - "conceptualization/comparison/standard-framework-crosswalk-v0.1.csv"\n      - "publications/2026-icae/manuscript-working-draft-v0.1.md"\n      - "publications/2026-icae/prohibited-conditional-wording-v0.1.md"\n      - "literature/standards-frameworks-baseline.md"\n      - "tools/r4_standards_governance_check.py"\n      - ".github/workflows/semantic-ci.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "shapes/**"
      - "rules/**"
      - "testdata/**"
      - "formalization/**"
      - "foundational/**"
      - "architecture/g2/**"
      - "governance/identity/**"
      - "tools/semrisk_semantic_ci.py"
      - "tools/issue50_semantic_mutation_check.py"
      - "tools/issue50_entailment_mutation_check.py"
      - "tools/r1_foundational_guardrail_check.py"
      - "tools/requirements-semantic-ci.txt"
      - "tools/semantic-tool-manifest.csv"
      - "evaluation/standards/**"\n      - "conceptualization/comparison/standard-framework-crosswalk-v0.1.csv"\n      - "publications/2026-icae/manuscript-working-draft-v0.1.md"\n      - "publications/2026-icae/prohibited-conditional-wording-v0.1.md"\n      - "literature/standards-frameworks-baseline.md"\n      - "tools/r4_standards_governance_check.py"\n      - ".github/workflows/semantic-ci.yml"

permissions:
  contents: read

jobs:
  semantic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: tools/requirements-semantic-ci.txt

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install pinned Python validators
        run: python -m pip install --disable-pip-version-check -r tools/requirements-semantic-ci.txt

      - name: Run deterministic pre-reasoner checks
        run: python tools/semrisk_semantic_ci.py --stage pre

      - name: Run Issue 50 semantic mutation negative controls
        run: python tools/issue50_semantic_mutation_check.py

      - name: Run R1 foundational guardrails
        run: python tools/r1_foundational_guardrail_check.py

      - name: Run R2 formal-semantics guardrails
        run: python tools/r2_formal_semantics_guard_check.py

      - name: Run R2 owner temporal-rule regression
        run: python tools/r2_owner_rule_temporal_check.py

      - name: Run R4 standards evidence-governance guard
        run: python tools/r4_standards_governance_check.py

      - name: Cache ROBOT 1.9.10
        id: robot-cache
        uses: actions/cache@v4
        with:
          path: .tools/robot.jar
          key: robot-1.9.10-sha256-16a73c074f3df359

      - name: Install and verify ROBOT 1.9.10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools build/semantic-ci
          if [ ! -f .tools/robot.jar ]; then
            curl -L --fail --retry 3 https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar -o .tools/robot.jar
          fi
          echo "16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105  .tools/robot.jar" | sha256sum -c -
          java -jar .tools/robot.jar --version | tee build/semantic-ci/robot-version.txt
          java -version 2>&1 | tee build/semantic-ci/java-version.txt
          python --version | tee build/semantic-ci/python-version.txt
          python -m pip freeze | sort > build/semantic-ci/python-packages.txt

      - name: Assemble deterministic ontology closure
        shell: bash
        run: |
          set -euo pipefail
          java -jar .tools/robot.jar merge --catalog ontology/catalog-v001.xml --input ontology/core/semrisk-core-v0.1.0-rc.1.ttl --input ontology/enterprise/semrisk-enterprise-v0.1.0-rc.1.ttl --input ontology/method/semrisk-method-v0.1.0-rc.1.ttl --input ontology/governance/semrisk-governance-v0.1.0-rc.1.ttl --input ontology/pharma/semrisk-pharma-v0.1.0-rc.1.ttl --input ontology/mappings/semrisk-mappings-v0.1.0-rc.1.ttl --output build/semantic-ci/merged.owl

      - name: Validate OWL 2 DL profile
        run: |
          java -jar .tools/robot.jar validate-profile --profile DL --input build/semantic-ci/merged.owl --output build/semantic-ci/owl-profile.txt

      - name: Run HermiT consistency and classification
        run: |
          java -jar .tools/robot.jar reason --reasoner HermiT --input build/semantic-ci/merged.owl --output build/semantic-ci/reasoned.owl

      - name: Check expected reasoned consequences
        run: python tools/semrisk_semantic_ci.py --stage post --reasoned build/semantic-ci/reasoned.owl

      - name: Prove missing-entailment mutation is detected
        run: python tools/issue50_entailment_mutation_check.py

      - name: Prove inconsistent negative fixture is detected
        shell: bash
        run: |
          set -euo pipefail
          java -jar .tools/robot.jar merge --catalog ontology/catalog-v001.xml --input build/semantic-ci/merged.owl --input testdata/negative/reasoner-inconsistent-record-risk.ttl --output build/semantic-ci/negative-inconsistent.owl
          set +e
          java -jar .tools/robot.jar reason --reasoner HermiT --input build/semantic-ci/negative-inconsistent.owl --output build/semantic-ci/negative-should-not-exist.owl > build/semantic-ci/negative-reasoner.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ERROR: known-inconsistent fixture unexpectedly passed HermiT."
            cat build/semantic-ci/negative-reasoner.log
            exit 1
          fi
          echo "PASS: HermiT rejected the known-inconsistent fixture." | tee build/semantic-ci/negative-reasoner-status.txt

      - name: Prove Risk/Assessment Result conflation is inconsistent
        shell: bash
        run: |
          set -euo pipefail
          java -jar .tools/robot.jar merge --catalog ontology/catalog-v001.xml --input build/semantic-ci/merged.owl --input testdata/negative/reasoner-inconsistent-result-risk.ttl --output build/semantic-ci/negative-result-risk.owl
          set +e
          java -jar .tools/robot.jar reason --reasoner HermiT --input build/semantic-ci/negative-result-risk.owl --output build/semantic-ci/negative-result-risk-should-not-exist.owl > build/semantic-ci/negative-result-risk.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ERROR: Risk/Assessment Result conflation unexpectedly passed HermiT."
            cat build/semantic-ci/negative-result-risk.log
            exit 1
          fi
          echo "PASS: HermiT rejected Risk/Assessment Result conflation." | tee build/semantic-ci/negative-result-risk-status.txt

      - name: Emit exact checksum inventory
        shell: bash
        run: |
          set -euo pipefail
          find ontology shapes rules testdata tools governance/identity architecture/g2 formalization foundational evaluation/standards conceptualization/comparison publications/2026-icae -type f \( -name '*.ttl' -o -name '*.rq' -o -name '*.csv' -o -name '*.yaml' -o -name '*.xml' -o -name '*.py' -o -name '*.md' \) -print0 | sort -z | xargs -0 sha256sum > build/semantic-ci/repository-input-sha256.txt
          git rev-parse HEAD > build/semantic-ci/git-commit.txt
          git diff --exit-code > build/semantic-ci/tracked-source-diff.txt
          git diff --cached --exit-code > build/semantic-ci/staged-source-diff.txt
          printf "clean tracked sources\n" > build/semantic-ci/git-status.txt

      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semrisk-semantic-ci-${{ github.sha }}
          path: build/semantic-ci/
          if-no-files-found: error
          retention-days: 30
