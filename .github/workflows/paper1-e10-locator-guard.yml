name: SemRisk Paper 1 E10 locator integrity
on:
  push:
    paths:
      - 'evaluation/e10/**'
      - 'conceptualization/comparison/comparison-cell-evidence-index.csv'
      - 'conceptualization/comparison/comparison-dimension-definitions.csv'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/ontology/generated/p1-r2-closure-manifest.json'
      - 'evaluation/e1-e4/issue29-e1-e4-results-v1.0.csv'
      - 'evaluation/e5-e6/e6-preliminary-validation-report-v0.1.md'
      - 'evaluation/e8-e11/issue31-readiness-results-v0.1.csv'
      - 'evaluation/parity/p49-parity-results-v1.0.csv'
      - 'evaluation/architecture/ea-capability-nonclaim-matrix-v1.0.csv'
      - 'publications/2026-icae/claim-calibration-preliminary-v0.1.csv'
      - 'evaluation/assurance/paper1-assurance-evidence-intake-v0.1.md'
      - 'tools/e10_locator_guard.py'
      - '.github/workflows/paper1-e10-locator-guard.yml'
  pull_request:
    paths:
      - 'evaluation/e10/**'
      - 'conceptualization/comparison/comparison-cell-evidence-index.csv'
      - 'conceptualization/comparison/comparison-dimension-definitions.csv'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/ontology/generated/p1-r2-closure-manifest.json'
      - 'evaluation/e1-e4/issue29-e1-e4-results-v1.0.csv'
      - 'evaluation/e5-e6/e6-preliminary-validation-report-v0.1.md'
      - 'evaluation/e8-e11/issue31-readiness-results-v0.1.csv'
      - 'evaluation/parity/p49-parity-results-v1.0.csv'
      - 'evaluation/architecture/ea-capability-nonclaim-matrix-v1.0.csv'
      - 'publications/2026-icae/claim-calibration-preliminary-v0.1.csv'
      - 'evaluation/assurance/paper1-assurance-evidence-intake-v0.1.md'
      - 'tools/e10_locator_guard.py'
      - '.github/workflows/paper1-e10-locator-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locator-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/e10_locator_guard.py --selftest
