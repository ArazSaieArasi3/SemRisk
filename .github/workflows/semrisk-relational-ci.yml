name: SemRisk relational twin CI

on:
  push:
    paths:
      - 'relational/**'
      - 'case/pharma/**'
      - 'ontology/core/**'
      - 'ontology/enterprise/**'
      - 'evaluation/parity/**'
      - 'evaluation/cq/**'
      - 'tools/e2e_scenario_rdf_tests.py'
      - 'tools/p49_sql_sparql_parity.py'
      - 'tools/issue50_crosslayer_mutation_check.py'
      - 'tools/issue52_cq_regression_check.py'
      - 'evaluation/erm/**'
      - 'profiles/enterprise/**'
      - 'method/**'
      - 'docs/governance/**'
      - 'publications/2026-icae/**'
      - 'tools/r3_erm_governance_check.py'
      - 'ontology/mappings/**'
      - 'evaluation/architecture/**'
      - 'tools/r5_architecture_governance_check.py'
      - 'evaluation/data/**'
      - 'tools/r6_migration_governance_check.py'
      - 'tools/r6_relational_governance_check.py'
      - 'datasets/**'
      - 'evaluation/e11/**'
      - 'tools/r7_pharma_governance_check.py'
      - '.github/workflows/semrisk-relational-ci.yml'
  pull_request:
    paths:
      - 'relational/**'
      - 'case/pharma/**'
      - 'ontology/core/**'
      - 'ontology/enterprise/**'
      - 'evaluation/parity/**'
      - 'evaluation/cq/**'
      - 'tools/e2e_scenario_rdf_tests.py'
      - 'tools/p49_sql_sparql_parity.py'
      - 'tools/issue50_crosslayer_mutation_check.py'
      - 'tools/issue52_cq_regression_check.py'
      - 'evaluation/erm/**'
      - 'profiles/enterprise/**'
      - 'method/**'
      - 'docs/governance/**'
      - 'publications/2026-icae/**'
      - 'tools/r3_erm_governance_check.py'
      - 'ontology/mappings/**'
      - 'evaluation/architecture/**'
      - 'tools/r5_architecture_governance_check.py'
      - 'evaluation/data/**'
      - 'tools/r6_migration_governance_check.py'
      - 'tools/r6_relational_governance_check.py'
      - 'datasets/**'
      - 'evaluation/e11/**'
      - 'tools/r7_pharma_governance_check.py'
      - '.github/workflows/semrisk-relational-ci.yml'
  workflow_dispatch:

jobs:
  postgres-relational-twin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semrisk
          POSTGRES_PASSWORD: semrisk
          POSTGRES_DB: semrisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semrisk -d semrisk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: semrisk
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: semrisk
      PGDATABASE: semrisk

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install RDF test dependency
        run: python3 -m pip install 'rdflib==7.6.0'

      - name: Record effective parity toolchain
        run: |
          python3 --version
          python3 -c 'import rdflib; print("RDFLib", rdflib.__version__)'
          psql --version
          psql -Atc "SHOW server_version"
          psql -Atc "SELECT version()"

      - name: Static catalog and mapping consistency
        run: python3 relational/scripts/validate_relational_catalog.py

      - name: R6 migration manifest governance
        run: python3 tools/r6_migration_governance_check.py

      - name: R6 relational governance
        run: python3 tools/r6_relational_governance_check.py

      - name: Clean build with ordered migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f relational/sql/reset.sql
          psql -v ON_ERROR_STOP=1 -f relational/sql/V001__paper1_projection.sql
          psql -v ON_ERROR_STOP=1 -f relational/sql/V001__views.sql
          psql -v ON_ERROR_STOP=1 -f relational/sql/V001__reference_data.sql
          psql -v ON_ERROR_STOP=1 -f relational/sql/V002__data_load_support.sql
          psql -v ON_ERROR_STOP=1 -f relational/sql/V005__r5_architecture_federation.sql
          psql -v ON_ERROR_STOP=1 -f relational/sql/V006__r6_projection_integrity.sql

      - name: Integrity and negative tests
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/tests/V001__integrity_tests.sql

      - name: Load governed Paper-1 data snapshot
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/load/P1_DATA_0_1_0_rc2.sql

      - name: Data-load reconciliation tests
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/tests/V002__data_load_tests.sql

      - name: Load end-to-end scenario
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/load/P1_E2E_SCENARIO_v1.sql

      - name: Upgrade populated scenario to qualified context
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/V007__qualified_assessment_context.sql

      - name: End-to-end relational scenario tests
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/tests/V003__e2e_scenario_tests.sql

      - name: R6 projection integrity regression
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/tests/V006__r6_projection_integrity_tests.sql

      - name: R7 Pharma case governance regression
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/tests/V007__r7_pharma_case_tests.sql

      - name: End-to-end RDF scenario tests
        run: python3 tools/e2e_scenario_rdf_tests.py

      - name: SQL-SPARQL semantic parity
        run: python3 tools/p49_sql_sparql_parity.py

      - name: Cross-layer negative controls
        run: python3 tools/issue50_crosslayer_mutation_check.py

      - name: CQ regression governance
        run: python3 tools/issue52_cq_regression_check.py

      - name: R3 ERM governance guard
        run: python3 tools/r3_erm_governance_check.py

      - name: R3 co-ownership and profile regression
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/tests/V004__r3_erm_profile_tests.sql

      - name: R5 architecture federation regression
        run: psql -v ON_ERROR_STOP=1 -f relational/sql/tests/V005__r5_architecture_federation_tests.sql

      - name: Catalog snapshot
        run: |
          psql -Atc "SELECT table_schema||'.'||table_name FROM information_schema.tables WHERE table_schema IN ('meta','ref','core','assessment','treatment','enterprise','governance','pharma','staging') ORDER BY 1;"
          psql -Atc "SELECT table_schema||'.'||table_name FROM information_schema.views WHERE table_schema IN ('meta','ref','core','assessment','treatment','enterprise','governance','pharma','staging') ORDER BY 1;"
