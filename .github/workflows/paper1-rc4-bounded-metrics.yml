name: Paper 1 rc4 bounded raw metrics
on:
  pull_request:
    paths:
      - 'evaluation/oquare/rc4-bounded/**'
      - 'evaluation/vveaa/rc4-bounded-metric-interpretation.md'
      - 'tools/measure_rc4_bounded_metrics.py'
      - 'tools/generate_rc4_formal_reference.py'
      - 'ontology/releases/0.2.0-rc.4/**'
      - 'ontology/vendor/**'
      - 'docs/formal/0.2.0-rc.4/source-manifest.json'
      - '.github/workflows/paper1-rc4-bounded-metrics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-metric-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rdflib==7.6.0
      - name: Protocol-bound calculations and synthetic sensitivity/rejection tests
        run: |
          python tools/measure_rc4_bounded_metrics.py --check
          python tools/pilot_oquare_structural.py --check
          python tools/generate_rc4_formal_reference.py --check
          python docs/execution/2026-10-04/validate_register.py
      - uses: actions/upload-artifact@v4
        with:
          name: rc4-bounded-metric-evidence
          path: evaluation/oquare/rc4-bounded/
