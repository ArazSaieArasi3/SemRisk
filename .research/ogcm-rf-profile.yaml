  evidence_provenance: "conceptualization/source-mining/ plus literature/ and datasets/ governed registries planned in W0/W1"
  mappings: "closest-ontology/standard/framework mappings, operational spreadsheet mappings, CM-PharmE bridge and dataset mappings planned before formal release"

validation_and_evaluation:
  selected_layers: [E1, E2, E3, E4, E5, E6, E7, E8, E9, E10, E11]
  reasoning: "HermiT/ROBOT planned after OWL formalization; no early consistency claim"
  shacl_or_constraints: "planned after conceptual and OWA-vs-constraint separation"
  cq_regression: "planned for Paper 1 release candidate"
  comparative_or_expert: "E10 closest-work/method comparison required for Paper 1; bounded expert/semantic validation planned if feasible and claim-relevant"
  reproducibility: "source coverage, mapping provenance, exact ontology/evaluation state, tool versions, queries and publication binding planned"

publication_bindings: []

portfolio_integration:
  manifest: ".research/manifest.yaml"

ci_execution_governance:
