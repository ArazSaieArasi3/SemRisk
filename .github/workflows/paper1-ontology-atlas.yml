name: Paper-1 ontology atlas

on:
  push:
    paths:
      - 'ontology/**/*.ttl'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/ontology/diagrams/**'
      - 'tools/build_p1_r2_ontology_atlas.py'
      - '.github/workflows/paper1-ontology-atlas.yml'
  pull_request:
    paths:
      - 'ontology/**/*.ttl'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/ontology/diagrams/**'
      - 'tools/build_p1_r2_ontology_atlas.py'
      - '.github/workflows/paper1-ontology-atlas.yml'

permissions:
  contents: read

jobs:
  source-derived-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'rdflib==7.6.0'
      - name: Check all local declarations and relation signatures
        run: python tools/build_p1_r2_ontology_atlas.py --check
