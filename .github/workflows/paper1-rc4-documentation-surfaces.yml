name: rc4 offline documentation surfaces
on:
  pull_request:
    paths:
      - 'docs/formal/**'
      - 'shapes/**'
      - 'rules/**'
      - 'evaluation/cq/issue52-cq-results-v1.0.csv'
      - 'foundational/exposure-scale-v0.2.0-rc.4/**'
      - 'docs/ontology/formal-ontology-description-p1-r2-v0.2.md'
      - 'docs/wiki/pages/**'
      - 'docs/wiki/p1-r2-wiki-publish-manifest-v0.1.json'
      - 'ontology/releases/0.2.0-rc.4/**'
      - 'ontology/vendor/**'
      - 'docs/documentation/rc4/**'
      - 'docs/documentation/documentation-surfaces.yaml'
      - 'docs/wiki/rc4/**'
      - 'site/ontology/0.2.0-rc.4/**'
      - 'docs/ontology/pages-version-registry-v0.1.json'
      - 'tools/*rc4*surfaces*'
      - 'tools/check_rc4_surface_history.py'
      - 'tools/generate_rc4_formal_reference.py'
      - '.github/workflows/paper1-rc4-documentation-surfaces.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/documentation/rc4/requirements.txt
      - run: |
          python tools/build_rc4_documentation_surfaces.py
          python tools/check_rc4_documentation_surfaces.py
          python tools/check_rc4_surface_history.py
          python tools/build_pages_reference.py --check
          python tools/check_pages_route_history.py
          python tools/wiki_formal_parity_qa.py
          python tools/wiki_publication_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: rc4-offline-surface-evidence
          path: docs/documentation/rc4/
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_rc4_surfaces_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc4-desktop-mobile-render-review
          path: build/rc4-surface-browser/
