name: Paper 1 qualified assessment context
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualified-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semrisk
          POSTGRES_PASSWORD: semrisk
          POSTGRES_DB: semrisk_context_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U semrisk -d semrisk_context_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: semrisk
      PGPASSWORD: semrisk
      PGDATABASE: semrisk_context_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r tools/requirements-qualified-context.txt
      - name: Check exact candidate binding and SHACL
        run: |
          python tools/build_qualified_context_manifest.py --check
          python tools/check_qualified_context.py --write
      - name: Build populated pre-migration database
        run: |
          python - <<'PY'
          import psycopg
          from pathlib import Path
          with psycopg.connect('', autocommit=True) as conn:
              for name in ['V001__paper1_projection.sql','V001__views.sql','V001__reference_data.sql','V002__data_load_support.sql','V005__r5_architecture_federation.sql','V006__r6_projection_integrity.sql','load/P1_DATA_0_1_0_rc2.sql','load/P1_E2E_SCENARIO_v1.sql']:
                  conn.execute((Path('relational/sql')/name).read_text())
          PY
      - name: Native upgrade, guarded rollback, RDF SQL round-trip and negative controls
        run: python tools/check_qualified_context_postgres.py --write
      - uses: actions/cache@v4
        with:
          path: .tools/robot.jar
          key: robot-1.9.10-sha256-16a73c074f3df359
      - name: Verify reasoner toolchain
        run: |
          mkdir -p .tools build/qualified-context
          if [ ! -f .tools/robot.jar ]; then
            curl -L --fail --retry 3 https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar -o .tools/robot.jar
          fi
          echo "16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105  .tools/robot.jar" | sha256sum -c -
          java -jar .tools/robot.jar --version
      - name: Assemble exact successor closure
        run: python tools/build_qualified_context_manifest.py --assemble
      - name: OWL 2 DL and HermiT on successor with positive fixture
        run: |
          java -jar .tools/robot.jar validate-profile --profile DL --input build/qualified-context/closure.owl --output build/qualified-context/owl-profile.txt
          java -jar .tools/robot.jar reason --reasoner HermiT --input build/qualified-context/closure.owl --output build/qualified-context/reasoned.owl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-context-evidence
          path: |
            evaluation/temporal/v0.2.0-rc.1/*results.json
            build/qualified-context/
