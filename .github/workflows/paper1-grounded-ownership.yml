name: Opt-in validation-first grounded ownership
on:
  pull_request:
    paths:
      - 'evaluation/grounded-ownership/v1/**'
      - 'tools/query_grounded_owners_v1.py'
      - 'tools/check_grounded_ownership_v1.py'
      - 'shapes/grounded-ownership-entrypoint-v1.ttl'
      - 'rules/enterprise/risk-owners-grounded-v1.rq'
      - 'ontology/releases/0.2.0-rc.4/**'
      - 'ontology/vendor/gufo-v1.0.0.ttl'
      - 'tools/check_rc4_extension.py'
      - 'rules/enterprise/risk-owners-at-v0.2.0-rc.1.rq'
      - 'shapes/assessment-context-v0.2.0-rc.1.ttl'
      - 'shapes/foundational-evidence-v0.2.0-rc.2.ttl'
      - 'foundational/responsibility-grounding-contract-v0.1.md'
      - 'foundational/revision-2026-10-05/decisions.md'
      - 'testdata/foundational/grounded-responsibility-v0.2.0-rc.2.ttl'
      - 'evaluation/antipatterns/0.2.0-rc.4/behavioral/results.json'
      - '.github/workflows/paper1-grounded-ownership.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install rdflib==7.6.0 pyshacl==0.40.1
      - uses: actions/cache@v4
        with:
          path: .tools/robot.jar
          key: robot-1.9.10-sha256-16a73c074f3df359
      - name: Pinned existing reasoning toolchain
        run: |
          mkdir -p .tools
          if [ ! -f .tools/robot.jar ]; then
            curl -L --fail --retry 3 https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar -o .tools/robot.jar
          fi
          echo "16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105  .tools/robot.jar" | sha256sum -c -
      - name: Actual validation-first entrypoint and bounded regressions
        run: |
          python tools/check_grounded_ownership_v1.py --robot .tools/robot.jar
          git diff --exit-code -- ontology/releases/0.2.0-rc.4 shapes/assessment-context-v0.2.0-rc.1.ttl shapes/foundational-evidence-v0.2.0-rc.2.ttl rules/enterprise/risk-owners-at-v0.2.0-rc.1.rq
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-ownership-entrypoint-evidence
          path: |
            build/grounded-ownership-v1/
            evaluation/grounded-ownership/v1/
