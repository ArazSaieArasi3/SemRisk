  core_boundary: "Domain-general risk semantics reusable across organizational and domain-specific contexts; Enterprise and Architecture are first application profiles; Health is the first broad domain priority; Pharma is an early bounded specialization linked to CM-PharmE"
  extensions:
    - "Enterprise"
    - "Architecture"
    - "Health"
    - "Pharma"
    - "Governance"
    - "Security"
    - "Finance"
    - "SupplyChain"
    - "News"
    - "AI"
    - "Environment"
