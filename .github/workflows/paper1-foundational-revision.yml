name: Paper 1 foundational successor
on:
  pull_request:
    paths:
      - 'ontology/releases/0.2.0-rc.2/**'
      - 'foundational/revision-2026-10-05/**'
      - 'shapes/foundational-evidence-*'
      - 'testdata/foundational/**'
      - 'tools/*foundational*'
      - 'conceptualization/core/core-concept-registry-v0.1.csv'
      - '.github/workflows/paper1-foundational-revision.yml'
  push:
    branches: [main]
    paths:
      - 'ontology/releases/0.2.0-rc.2/**'
      - 'foundational/revision-2026-10-05/**'
      - 'tools/*foundational*'
      - '.github/workflows/paper1-foundational-revision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundational-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r tools/requirements-qualified-context.txt
      - name: Candidate hashes and bounded foundational checks
        run: |
          python tools/build_foundational_candidate.py --check --assemble
          python tools/check_foundational_revision.py --write
          python tools/check_qualified_context.py
      - uses: actions/cache@v4
        with:
          path: .tools/robot.jar
          key: robot-1.9.10-sha256-16a73c074f3df359
      - name: Verify formal toolchain
        run: |
          mkdir -p .tools
          if [ ! -f .tools/robot.jar ]; then
            curl -L --fail --retry 3 https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar -o .tools/robot.jar
          fi
          echo "16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105  .tools/robot.jar" | sha256sum -c -
          java -jar .tools/robot.jar --version
          python - <<'PYCODE'
          import zipfile,json
          with zipfile.ZipFile('.tools/robot.jar') as z:
              matches={n:z.read(n).decode() for n in z.namelist() if 'hermit' in n.lower() and n.endswith('pom.properties')}
          assert matches, 'Bundled HermiT metadata not found; inspect rather than invent version'
          print('EMBEDDED_HERMIT_METADATA='+json.dumps(matches))
          PYCODE
      - name: Actual OWL 2 DL and positive HermiT
        run: |
          if ! java -jar .tools/robot.jar validate-profile --profile DL --input build/foundational-candidate/positive.owl --output build/foundational-candidate/dl.txt; then
            cat build/foundational-candidate/dl.txt
            exit 1
          fi
          java -jar .tools/robot.jar reason --reasoner HermiT --axiom-generators "SubClass ClassAssertion" --include-indirect true --input build/foundational-candidate/positive.owl --output build/foundational-candidate/reasoned.owl
          python - <<'PYCODE'
          from rdflib import Graph,RDF,Namespace
          ex=Namespace('urn:semrisk:run5:');sr=Namespace('urn:semrisk:entity:');gufo=Namespace('http://purl.org/nemo/gufo#')
          asserted=Graph().parse('build/foundational-candidate/positive.owl')
          inferred=Graph().parse('build/foundational-candidate/reasoned.owl')
          for typ in [sr['SR-CPT-031'],gufo.Relator]:
              assert (ex.responsibility,RDF.type,typ) not in asserted, 'Probe was already asserted'
              assert (ex.responsibility,RDF.type,typ) in inferred, 'Required class assertion not inferred'
          print('TWO_DECLARED_CLASS_ENTAILMENTS_PASS')
          PYCODE
          echo FORMAL_POSITIVE_PASS
      - name: Open-world missing witness is consistent but not data completeness
        run: |
          java -jar .tools/robot.jar reason --reasoner HermiT --input build/foundational-candidate/incomplete.owl --output build/foundational-candidate/incomplete-reasoned.owl
          echo OWA_MISSING_NAMED_WITNESS_CONSISTENT
      - name: Countermodel for non-entailment of Risk as mediated Endurant
        run: |
          java -jar .tools/robot.jar reason --reasoner HermiT --input build/foundational-candidate/countermodel.owl --output build/foundational-candidate/countermodel-reasoned.owl
          echo RISK_ENDURANT_NON_ENTAILMENT_COUNTERMODEL_PASS
      - name: Intentional contradictory individual must fail for inconsistency
        run: |
          if java -jar .tools/robot.jar reason --reasoner HermiT --input build/foundational-candidate/contradiction.owl --output build/foundational-candidate/contradiction-reasoned.owl > build/foundational-candidate/negative.log 2>&1; then
            echo 'FAIL: contradictory individual unexpectedly accepted'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          log=Path('build/foundational-candidate/negative.log').read_text()
          assert 'inconsistent' in log.lower() or 'inconsistency' in log.lower(), 'Failure was not established as an ontology inconsistency: '+log[-1500:]
          print('EXPECTED_OWL_INCONSISTENCY_DETECTED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundational-successor-evidence
          path: |
            evaluation/foundational/2026-10-05/results.json
            build/foundational-candidate/
