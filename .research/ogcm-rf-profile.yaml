profile_schema_version: "1.0"

implementation:
  research_id: R-022
  repository: "ArazSaieArasi3/SemRisk"
  profile_status: active

framework:
  name: OGCM-RF
  framework_ref: "commit:4822b1a1b7978e94e66bd6a283024bac78b6a0b8"
  conformance_level: not_assessed

semantic_scope:
  semantic_source_of_truth: "Governed conceptual/core/relation/module registries and P1-R2 canonical ontology modules under ontology/; W0/W1 source-mining artifacts remain evidence rather than canonical semantics"
  core_boundary: "Domain-general risk semantics reusable across organizational and domain-specific contexts; Enterprise and Architecture are first application profiles; Health is the first broad domain priority; Pharma is the first bounded specialization linked to CM-PharmE"
  external_owner_policy: "Externally owned semantics remain externally canonical and are consumed through explicit versioned imports, references, alignments or bridges recorded in semantic-dependencies.yaml and mapping artifacts"
  extensions:
    - "Enterprise"
    - "Architecture"
    - "Health"
    - "Pharma"
    - "Governance"
    - "Security"
    - "Finance"
    - "SupplyChain"
    - "News"
    - "AI"
    - "Environment"
  historical_or_superseded: []

modeling:
  foundational_ontology: [UFO, gUFO]
  conceptual_modeling_language: [OntoUML]
  ontology_languages: [OWL, RDF, Turtle]
  constraint_languages: [SHACL]
  canonical_serialization: "Six P1-R2 candidate Turtle modules under ontology/, with local catalog-resolved gUFO import; publication-bound serialization remains pending #55"

identity_and_release:
  ontology_iri: "See ontology/p1-r2-candidate-manifest.yaml and module headers; no persistent scholarly release IRI claimed"
  persistent_iri_status: "not yet declared"
  current_semantic_release: "none; P1-R2 0.1.0-rc.1 is a candidate, not a release"
  development_state: "G1/G2 closed with recorded conditions; P1-R2 formal/evaluation candidate built; #54 assurance and #55 publication binding pending"
  release_manifest: "none"

traceability:
  concept_registry: "Governed conceptualization/ and ontology/ inventories; exact P1-R2 local formal denominator in ontology/formal-entity-inventory-v0.1.csv"
  relation_registry: "Governed conceptualization/ relation records and P1-R2 object-property inventory; exact candidate source under ontology/"
  domain_or_module_registry: "docs/research/domain-profile-roadmap.md; canonical module/profile registry planned after reconciliation"
  competency_questions: "Issue #7 now owns implementation-independent semantic requirements and conceptual CQs after G1 and before G2; executable CQ regression is separated into Issue #52"
  evidence_provenance: "conceptualization/source-mining/source-register.csv plus source-specific coverage/concept artifacts, literature/ and datasets/"
  mappings: "closest-work/standards mappings in W1/W2; operational source mapping active; CM-PharmE bridge and dataset mappings before Paper-1 release"
  semantic_dependencies: "semantic-dependencies.yaml"

validation_and_evaluation:
  selected_layers: [E1, E2, E3, E4, E5, E6, E7, E8, E9, E10, E11]
  reasoning: "Deterministic P1-R2 semantic build and regression evidence under #44; reasoner claims are limited to executed exact-ref checks, not domain validation or final assurance"
  shacl_or_constraints: "shapes/semrisk-paper1-shapes-v0.1.0-rc.1.ttl; SHACL is separate from OWL entailment and database constraints"
  cq_regression: "40 governed CQs with 26 executable, seven partial, six conceptual and one deferred in the P1-R2 formal source QA; #52 and #54 govern claim-level interpretation"
  comparative_or_expert: "E10 closest-work/method comparison required for Paper 1; bounded expert semantic validation has a dedicated protocol under Issue #51"
  reproducibility: "source coverage, SHA-bound operational input, dataset/PID/version records, mappings, queries, tool versions, negative controls and publication binding are required by the current backlog"

publication_bindings: []

portfolio_integration:
  manifest: ".research/manifest.yaml"

ci_execution_governance:
  generic_policy: "ArazSaieArasi3/araz-research-portfolio/governance/ci-execution-governance.md"
  semantic_profile: "ArazSaieArasi3/OGCM-RF/framework/semantic-ci-execution-profile.md"
  adoption_status: staged
  automatic_workflows: []
  authoritative_gates: []
  semantic_source_paths: []
  expensive_gate_policy: "Do not add heavy semantic CI before canonical ontology/constraints/validators exist; when they do, use one change-aware development path and SHA-bound authoritative release/publication gates"
  evidence_binding: "SHA-bound"
  deviations: []

adoption:
  deviations:
    - "Paper 1 uses a conference-time bounded SemRisk subset while the comprehensive ontology program remains a longer-lived Research; publication claims must bind to the exact evaluated subset/release."
  deferred_capabilities:
    - "persistent IRI"
    - "canonical modular formal ontology"
    - "full Health profile"
    - "full Pharma profile"
    - "Risk Intelligence Platform"
    - "knowledge graph and Newsium/Commentium runtime integration"
    - "Ontology Quality Framework adoption/pilot until the external OQF Research has a governed identity and stable candidate contract"
  last_reviewed: "2026-09-26"
  notes: "SemRisk retains the claim-dependent E1-E11 method and Paper-1 bounded candidate. Research/Ontology documentation adoption is partial at OGCM-RF-DOC-RO 0.1, ref 4822b1a1b7978e94e66bd6a283024bac78b6a0b8; see docs/documentation/research-ontology-profile-adoption.yaml, documentation-surfaces.yaml and p1-r2-documentation-rollout-2026-09-26.md. Wiki is private and live; Pages is offline only. Theorem proving, model checking and probabilistic propagation remain deferred. No full OGCM conformance or scholarly release is claimed."
