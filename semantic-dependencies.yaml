schema_version: "1.0"
repository: "ArazSaieArasi3/SemRisk"

semantic_owner:
  research_id: R-022
  canonical_scope: "Domain-general SemRisk risk semantics plus governed SemRisk-owned profiles, mappings, evaluation evidence and data projections; external ontology semantics remain externally canonical."
  namespaces: []

dependencies:
  - id: DEP-001
    repository: "https://github.com/unibz-core/value-and-risk-ontology"
    semantic_scope: "Reference value/risk semantics used to assess reuse, alignment and extension of the SemRisk Core."
    canonical_owner: "COVER / Common Ontology of Value and Risk maintainers"
    relation: aligns_with
    requirement: required
    ref_policy: unresolved
    mapping_path: "mappings/"
    rationale: "COVER is the primary well-founded reference ontology against which SemRisk Core overlap and reuse must be decided before local novelty is claimed."
    status: active
    notes: "Technical baseline is mined as SRC-ON-001; immutable release/commit and license must be pinned under Issues #14/#21 before release-bound mappings."

  - id: DEP-002
    repository: "https://github.com/unibz-core/security-ontology"
    semantic_scope: "Security/risk/prevention semantics used where SemRisk Security or treatment/control semantics overlap ROSE."
    canonical_owner: "ROSE / Reference Ontology for Security Engineering maintainers"
    relation: aligns_with
    requirement: conditional
    ref_policy: unresolved
    mapping_path: "mappings/"
    rationale: "ROSE is a material well-founded comparator and potential reuse/alignment source for security-mechanism and risk-prevention semantics."
    status: active
    notes: "Technical baseline is mined as SRC-ON-002; exact immutable ref/license remains to be resolved before release-bound reuse."

  - id: DEP-003
    repository: "ArazSaieArasi3/CM-PharmE"
    semantic_scope: "Pharmaceutical ecosystem semantics required by the bounded Pharma specialization/case."
    canonical_owner: "R-006 / CM-PharmE"
    relation: federates_with
    requirement: required
    ref_policy: unresolved
    mapping_path: "mappings/"
    rationale: "CM-PharmE remains canonical owner of pharmaceutical ecosystem concepts; SemRisk owns risk-specific semantics and context-dependent risk relevance."
    status: planned
    notes: "Issue #5 must pin the exact CM-PharmE release/commit and define the bridge before Paper-1 release binding."

  - id: DEP-004
    repository: "ArazSaieArasi3/Newsium"
    semantic_scope: "News/event/claim/source semantics for future Risk Intelligence evidence ingestion."
    canonical_owner: "R-004 / Newsium"
    relation: federates_with
    requirement: optional
    ref_policy: unresolved
    mapping_path: "mappings/"
    rationale: "Newsium is a future external semantic owner; news artifacts must not be copied into SemRisk Core."
    status: planned
    notes: "Post-Paper1 only by default under Issue #6."

  - id: DEP-005
    repository: "ArazSaieArasi3/Commentium"
    semantic_scope: "Comment/interpretation semantics for future Risk Intelligence evidence ingestion."
    canonical_owner: "R-003 / Commentium"
    relation: federates_with
    requirement: optional
    ref_policy: unresolved
    mapping_path: "mappings/"
    rationale: "Commentium remains canonical owner of comment/interpretation semantics; SemRisk only consumes risk-relevance/evidence bridges later."
    status: planned
    notes: "Post-Paper1 only by default under Issue #6."

  - id: DEP-006
    repository: "ArazSaieArasi3/business-ontology"
    semantic_scope: "Business objective, capability, process, control and metric semantics needed by future Business↔Risk federation."
    canonical_owner: "R-021 / Business Ontology"
    relation: federates_with
    requirement: conditional
    ref_policy: unresolved
    mapping_path: "mappings/"
    rationale: "Business Ontology remains canonical owner of business semantics; SemRisk owns risk semantics."
    status: planned
    notes: "Post-Paper1 by default under Issue #37 unless Paper-1 scope is explicitly reopened."

  - id: DEP-007
    repository: "ArazSaieArasi3/ontology-quality-framework"
    semantic_scope: "Generic ontology-quality and VVEAA framework semantics for a future SemRisk adopter/pilot."
    canonical_owner: "Ontology Quality Framework Research — canonical Research ID pending Portfolio governance"
    relation: application_profile_of
    requirement: optional
    ref_policy: unresolved
    mapping_path: "evaluation/"
    rationale: "Generic ontology-quality semantics must not be duplicated inside SemRisk; SemRisk may later become an adopter/pilot."
    status: planned
    notes: "Deferred under Issue #57 until OQF has a governed Portfolio identity and stable candidate contract."
