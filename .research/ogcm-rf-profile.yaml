    - "full Pharma profile"
    - "Risk Intelligence Platform"
    - "knowledge graph and Newsium/Commentium runtime integration"
  last_reviewed: "2026-08-29"
  notes: "SemRisk adopts OGCM-RF Exhaustive Source Mining as a hard pre-formalization gate and the E1-E11 claim-dependent evaluation framework. Domain labels follow the no-and/no-ampersand naming convention."
