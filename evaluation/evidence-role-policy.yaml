schema_version: "1.0"
research_id: R-022
paper: "SemRisk Paper 1 / ICAE 2026"
status: frozen_for_study_design
frozen_on: "2026-09-17"

roles:
  discovery:
    purpose: "Discover candidate terminology, concepts, relations, events, states, sources, comparators, datasets and research gaps."
    can_support:
      - "source landscape"
      - "candidate generation"
      - "search/review coverage"
    cannot_alone_support:
      - "independent validation"
      - "generalized correctness"

  design:
    purpose: "Directly influence SemRisk conceptual, foundational, formal, mapping or case-design decisions."
    can_support:
      - "design rationale"
      - "evidence-grounded construction"
    cannot_alone_support:
      - "independent validation of the decision it influenced"

  reconciliation:
    purpose: "Resolve or preserve conflicts across already discovered/mined evidence sources and establish semantic dispositions."
    can_support:
      - "cross-source synthesis"
      - "terminology/conflict decisions"
    cannot_alone_support:
      - "external validation"

  illustrative:
    purpose: "Explain a concept, pattern, mapping or scenario without being used as validation evidence."
    can_support:
      - "explanation"
      - "worked example"
    cannot_alone_support:
      - "correctness"
      - "coverage"
      - "transferability"

  regression:
    purpose: "Detect later semantic/technical regressions using controlled fixtures, CQs, mappings or scenario tests."
    can_support:
      - "regression detection"
      - "build stability"
    cannot_alone_support:
      - "external/domain validation"

  independent_validation:
    purpose: "Evaluate a frozen semantic/design commitment using evidence that did not materially shape that commitment."
    independence_requirement: "The artifact/subset must be demonstrably untouched by the tested design decision or the dual role must be disclosed and the claim narrowed."
    can_support:
      - "bounded external validation"
    cannot_alone_support:
      - "universal generalization"

  holdout:
    purpose: "Predeclared untouched subset reserved for post-freeze evaluation."
    independence_requirement: "Partition rule, exact version/checksum and holdout boundary must be declared before result inspection."
    can_support:
      - "bounded independent evaluation"
    cannot_alone_support:
      - "population-wide representativeness without sampling evidence"

  comparative:
    purpose: "Support direct comparison against standards, frameworks, ontologies, methods or prior work under common criteria."
    can_support:
      - "difference/overlap/reuse analysis"
      - "bounded novelty claims"
    cannot_alone_support:
      - "overall superiority ranking"

  future_only:
    purpose: "Preserve a source/artifact for successor research while excluding it from the Paper-1 evidence chain."
    can_support:
      - "future-work planning"
    cannot_alone_support:
      - "Paper-1 claims"

rules:
  - id: ER-001
    rule: "Every artifact used in Paper-1 evaluation must have at least one explicit role before its result is interpreted."
  - id: ER-002
    rule: "An artifact that materially shaped a tested semantic commitment cannot be called independent_validation for that same commitment unless an untouched predeclared partition exists."
  - id: ER-003
    rule: "Synthetic data are illustrative/regression/application-test evidence by default, never independent real-world validation evidence."
  - id: ER-004
    rule: "Role assignment is version/subset specific; one dataset may have different roles for different partitions only with exact provenance."
  - id: ER-005
    rule: "Role changes after result inspection require a decision record and cannot erase the historical role."
  - id: ER-006
    rule: "Coverage, correctness, utility, reproducibility, novelty and transferability are distinct claim types and require claim-appropriate evidence."
  - id: ER-007
    rule: "Operational Jira evidence is design/discovery/reconciliation evidence for semantics it influenced and is not automatically independent validation."
  - id: ER-008
    rule: "Pharma/CM-PharmE evidence used to design the Pharma profile/case is not independent validation of that same design unless a holdout or separate source family is used."
  - id: ER-009
    rule: "Formal reasoner, SHACL or SQL integrity results are verification evidence and cannot be relabeled as semantic/domain validation."
  - id: ER-010
    rule: "Expert evidence must disclose reviewer expertise, project involvement and independence; author judgment is not external expert validation."

required_fields_for_role_assignment:
  - artifact_id
  - exact_version_or_ref
  - subset_or_partition
  - assigned_role
  - assignment_date
  - rationale
  - semantic_decisions_influenced
  - claims_allowed
  - independence_status
  - leakage_risk
  - downstream_issue
