name: SemRisk revision distinction and source checks
on:
  push:
    paths:
      - 'evaluation/e10/controlled-distinction-study-v1/**'
      - 'evaluation/standards/nist-schema-audit-2026-10-04/**'
      - 'evaluation/expert/*v1.1*'
      - 'case/pharma/literature-*'
      - 'conceptualization/comparison/paper1-claim-critical-comparison-2026-10-04.csv'
      - 'docs/execution/2026-10-04/**'
      - 'tools/run_distinction_study.py'
      - 'tools/check_revision_source_audit.py'
      - '.github/workflows/paper1-revision-distinction-study.yml'
  pull_request:
    paths:
      - 'evaluation/e10/controlled-distinction-study-v1/**'
      - 'evaluation/standards/nist-schema-audit-2026-10-04/**'
      - 'evaluation/expert/*v1.1*'
      - 'case/pharma/literature-*'
      - 'conceptualization/comparison/paper1-claim-critical-comparison-2026-10-04.csv'
      - 'docs/execution/2026-10-04/**'
      - 'tools/run_distinction_study.py'
      - 'tools/check_revision_source_audit.py'
      - '.github/workflows/paper1-revision-distinction-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-evidence-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install rdflib==7.6.0
      - run: python tools/run_distinction_study.py --output /tmp/distinction-results.json
      - run: python tools/check_revision_source_audit.py
      - run: python docs/execution/2026-10-04/validate_register.py
