name: Paper-1 asserted closure reference

on:
  push:
    paths:
      - 'ontology/**/*.ttl'
      - 'ontology/catalog-v001.xml'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/ontology/generated/**'
      - 'tools/generate_formal_asserted_reference.py'
      - '.github/workflows/paper1-asserted-closure-reference.yml'
  pull_request:
    paths:
      - 'ontology/**/*.ttl'
      - 'ontology/catalog-v001.xml'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/ontology/generated/**'
      - 'tools/generate_formal_asserted_reference.py'
      - '.github/workflows/paper1-asserted-closure-reference.yml'

permissions:
  contents: read

jobs:
  generated-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RDF parser
        run: python -m pip install 'rdflib==7.6.0'
      - name: Check offline asserted closure and generated reference drift
        run: python tools/generate_formal_asserted_reference.py --check
