name: Paper 1 rc4 claim and evidence-role calibration
on:
  pull_request:
    paths:
      - 'publications/2026-icaea-sbu/**'
      - 'evaluation/integrity/**'
      - 'evaluation/oquare/rc4-bounded/**'
      - 'case/pharma/literature-pilot-v0.1.0/**'
      - 'docs/formal/**'
      - 'foundational/**'
      - 'ontology/**'
      - 'shapes/**'
      - 'rules/**'
      - 'datasets/ds001-ds004-access-disposition-2026-10-02.md'
      - 'evaluation/exposure-scale/v0.2.0-rc.4/ci-evidence.json'
      - 'evaluation/parity/p49-parity-results-v1.0.csv'
      - 'evaluation/e10/**'
      - 'tools/check_rc4_claim_calibration.py'
      - 'tools/author_review_claim_guard.py'
      - 'docs/execution/2026-10-04/scientific-contract.md'
      - '.github/workflows/paper1-rc4-claim-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-claim-bindings-and-negatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact historical evidence commit
        run: git fetch --no-tags --depth=1 origin c02f7d2213191a71618f80cf702dbd6959a81d39
      - name: Current bindings and protected evidence states
        run: |
          python tools/check_rc4_claim_calibration.py
          python tools/author_review_claim_guard.py --selftest
          python tools/paper1_vveaa_evidence_guard.py --selftest
          python docs/execution/2026-10-04/validate_register.py
