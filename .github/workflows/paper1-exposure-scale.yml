name: Paper 1 exposure and scale successor
on:
  pull_request:
    paths: ['ontology/releases/0.2.0-rc.4/**', 'foundational/exposure-scale-*/**', 'evaluation/exposure-scale/**', 'diagrams/ontouml/0.2.0-rc.4/**', 'tools/*exposure*', 'tools/*rc4*', 'shapes/exposure-scale-*', 'rules/core/exposure-*', 'testdata/foundational/exposure-scale-*', 'relational/scripts/exposure_io.py', '.github/workflows/paper1-exposure-scale.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exposure-scale-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semrisk
          POSTGRES_PASSWORD: semrisk
          POSTGRES_DB: semrisk_exposure_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U semrisk -d semrisk_exposure_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: semrisk
      PGPASSWORD: semrisk
      PGDATABASE: semrisk_exposure_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          python -m pip install -r tools/requirements-qualified-context.txt -r diagrams/ontouml/0.2.0-rc.4/requirements.txt
          npm install --no-save --package-lock=false @viz-js/viz@3.25.0
      - name: Exact successor and frozen source binding
        run: |
          python tools/build_exposure_scale_manifest.py --check
          python tools/build_semantic_identity_candidate.py --check
          python tools/check_exposure_scale.py --assemble
      - name: Native exposure RDF SQL parity
        run: |
          python - <<'PY'
          import psycopg
          from pathlib import Path
          with psycopg.connect('',autocommit=True) as c:
              c.execute(Path('relational/sql/V001__paper1_projection.sql').read_text())
          PY
          python tools/check_exposure_postgres.py
      - name: Editable model, semantic parity and rendering
        run: |
          python tools/check_ontouml_atlas_rc4.py
          python tools/build_ontouml_atlas_rc4.py
          git diff --exit-code -- diagrams/ontouml/0.2.0-rc.4/model-base.json diagrams/ontouml/0.2.0-rc.4/view-spec.json diagrams/ontouml/0.2.0-rc.4/*coverage.csv diagrams/ontouml/0.2.0-rc.4/multiplicity-evidence.csv diagrams/ontouml/0.2.0-rc.4/views/*.dot
          node tools/render_ontouml_views_rc4.cjs
          python tools/package_ontouml_atlas_rc4.py
          python tools/check_ontouml_atlas_rc4.py
      - uses: actions/cache@v4
        with:
          path: .tools/robot.jar
          key: robot-1.9.10-sha256-16a73c074f3df359
      - name: Pinned reasoning toolchain
        run: |
          mkdir -p .tools
          if [ ! -f .tools/robot.jar ]; then
            curl -L --fail --retry 3 https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar -o .tools/robot.jar
          fi
          echo "16a73c074f3df359a7338a84b4e0788785fe06117f931bb9796e9619ea776105  .tools/robot.jar" | sha256sum -c -
          java -jar .tools/robot.jar --version
          python - <<'PY'
          import zipfile,json
          with zipfile.ZipFile('.tools/robot.jar') as z:
              meta={n:z.read(n).decode() for n in z.namelist() if 'hermit' in n.lower() and n.endswith('pom.properties')}
          assert meta
          print('EMBEDDED_HERMIT_METADATA='+json.dumps(meta))
          PY
      - name: Actual OWL 2 DL and four type entailments
        run: |
          if ! java -jar .tools/robot.jar validate-profile --profile DL --input build/exposure-scale/positive.owl --output build/exposure-scale/dl.txt; then
            cat build/exposure-scale/dl.txt
            exit 1
          fi
          java -jar .tools/robot.jar reason --reasoner HermiT --axiom-generators "SubClass ClassAssertion" --include-indirect true --input build/exposure-scale/positive.owl --output build/exposure-scale/reasoned.owl
          python - <<'PY'
          import json
          from pathlib import Path
          from rdflib import Graph,RDF,URIRef
          p=Path('build/exposure-scale');a=Graph().parse(p/'positive.owl');g=Graph().parse(p/'reasoned.owl')
          for s,t in json.loads((p/'expected-entailments.json').read_text()):
              triple=(URIRef(s),RDF.type,URIRef(t))
              assert triple not in a and triple in g, str(triple)
          print('EXPOSURE_SCALE_ENTAILMENTS_PASS=4')
          PY
      - name: Two consistent countermodels and two rejected contradictions
        run: |
          for probe in no-forced-consequence open-world-incomplete; do
            java -jar .tools/robot.jar reason --reasoner HermiT --input "build/exposure-scale/$probe.owl" --output "build/exposure-scale/$probe-reasoned.owl"
          done
          for probe in scale-as-abstract exposure-as-value; do
            if java -jar .tools/robot.jar reason --reasoner HermiT --input "build/exposure-scale/$probe.owl" --output "build/exposure-scale/$probe-reasoned.owl" > "build/exposure-scale/$probe.log" 2>&1; then
              echo "FAIL: contradiction accepted: $probe"
              exit 1
            fi
          done
          python - <<'PY'
          from pathlib import Path
          for p in ['scale-as-abstract','exposure-as-value']:
              s=Path('build/exposure-scale/'+p+'.log').read_text().lower()
              assert 'inconsistent' in s or 'inconsistency' in s
          print('EXPOSURE_SCALE_COUNTERMODELS_PASS=2')
          print('EXPOSURE_SCALE_EXPECTED_INCONSISTENCIES=2')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exposure-scale-successor-evidence
          path: |
            build/exposure-scale/
            evaluation/exposure-scale/v0.2.0-rc.4/
            diagrams/ontouml/0.2.0-rc.4/
