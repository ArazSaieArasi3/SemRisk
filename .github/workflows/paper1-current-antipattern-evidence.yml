name: Current bounded antipattern source evidence
on:
  pull_request:
    paths:
      - 'ontology/releases/0.2.0-rc.4/**'
      - 'diagrams/ontouml/0.2.0-rc.4/view-spec.json'
      - 'foundational/exposure-scale-v0.2.0-rc.4/concept-category-audit.csv'
      - 'foundational/foundational-antipattern-register.csv'
      - 'evaluation/antipatterns/0.2.0-rc.4/**'
      - 'docs/execution/2026-10-04/**'
      - 'publications/2026-icaea-sbu/claims-rc4/claim-register.json'
      - 'tools/check_current_antipattern_evidence.py'
      - 'tools/generate_rc4_formal_reference.py'
      - '.github/workflows/paper1-current-antipattern-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asserted-source-subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rdflib==7.6.0
      - run: python tools/check_current_antipattern_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-current-antipattern-evidence
          path: evaluation/antipatterns/0.2.0-rc.4/
      - name: Existing contract acceptance anchors
        run: |
          python docs/execution/2026-10-04/validate_register.py
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          annex=json.loads(Path('docs/execution/2026-10-04/scope-contract-acceptance-2026-10-06.json').read_text())
          for path, expected in annex['source_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected, path
          assert {r['id'] for r in annex['requirements']}=={'1.2','1.3','2.8','2.9','2.10'}
          PY
