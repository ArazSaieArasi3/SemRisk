name: Paper-1 WebVOWL browser QA

on:
  push:
    paths:
      - 'docs/ontology/generated/webvowl-candidate-v0.1/**'
      - 'docs/ontology/generated/webvowl-viewer-candidate-v0.1/**'
      - 'tools/browser_qa_webvowl.js'
      - '.github/workflows/paper1-webvowl-browser-qa.yml'
  pull_request:
    paths:
      - 'docs/ontology/generated/webvowl-candidate-v0.1/**'
      - 'docs/ontology/generated/webvowl-viewer-candidate-v0.1/**'
      - 'tools/browser_qa_webvowl.js'
      - '.github/workflows/paper1-webvowl-browser-qa.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/webvowl-qa" --no-save --no-audit --no-fund playwright@1.55.1
      - run: "$RUNNER_TEMP/webvowl-qa/node_modules/.bin/playwright" install --with-deps chromium
      - run: NODE_PATH="$RUNNER_TEMP/webvowl-qa/node_modules" node tools/browser_qa_webvowl.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webvowl-private-browser-qa
          path: webvowl-browser-qa-artifacts/
          if-no-files-found: ignore
