name: Paper-1 Wiki draft formal parity

on:
  push:
    paths:
      - 'ontology/**/*.ttl'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/ontology/generated/**'
      - 'docs/wiki/pages/Semantic-Architecture.md'
      - 'docs/wiki/pages/Formal-Reference.md'
      - 'tools/wiki_formal_parity_qa.py'
      - '.github/workflows/paper1-wiki-formal-parity.yml'
  pull_request:
    paths:
      - 'ontology/**/*.ttl'
      - 'docs/ontology/p1-r2-formal-source-entity-reference-v0.1.csv'
      - 'docs/ontology/generated/**'
      - 'docs/wiki/pages/Semantic-Architecture.md'
      - 'docs/wiki/pages/Formal-Reference.md'
      - 'tools/wiki_formal_parity_qa.py'
      - '.github/workflows/paper1-wiki-formal-parity.yml'

permissions:
  contents: read

jobs:
  source-generated-draft-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'rdflib==7.6.0'
      - run: python tools/wiki_formal_parity_qa.py
