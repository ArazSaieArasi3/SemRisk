  conceptual_modeling_language: [OntoUML]
  ontology_languages: [OWL, RDF, Turtle]
  constraint_languages: [SHACL]
  canonical_serialization: "Not yet declared; formalization is blocked until source-complete reconciliation and foundational-analysis gates"

identity_and_release:
